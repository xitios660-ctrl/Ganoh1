name: GANOH private executor fixture restore
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ganoh-private-fixture
  cancel-in-progress: false
jobs:
  fixtures:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify repository is private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq .private > /tmp/is-private
          python -c "assert open('/tmp/is-private').read().strip() == 'true'"
      - uses: actions/checkout@v4
        with:
          repository: xitios660-ctrl/Ganoh1
          ref: a50e04525721d230b8ae5b3d9814cd51fe9b1ff7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/data_bridge/requirements.txt
      - name: Start disposable Mongo8 snapshot source and restore target
        run: |
          docker run -d --name ganoh-fixtures --tmpfs /data/db:rw,size=1g -p 127.0.0.1:27028:27017 mongo:8 --replSet rs0 --bind_ip_all --wiredTigerCacheSizeGB 0.25 --setParameter ttlMonitorEnabled=false
          for i in {1..30}; do
            if docker exec ganoh-fixtures mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec ganoh-fixtures mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..30}; do
            if docker exec ganoh-fixtures mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 1
          done
      - name: Run encrypted capture and restore tests with fixtures only
        run: python -m unittest discover -s backend/data_bridge/tests -v
      - name: Verify reader preflight against actual local SCRAM metadata
        run: |
          python - <<'PY'
          import secrets
          from pymongo import MongoClient
          from backend.data_bridge.preflight import require_backup_reader
          from backend.data_bridge.archive import ArchiveError
          host='mongodb://127.0.0.1:27028/?directConnection=true'
          admin=MongoClient(host,serverSelectionTimeoutMS=5000)
          for role in ('read','readWrite'):
              username='fixture_'+role
              password=secrets.token_urlsafe(32)
              admin.admin.command('createUser',username,pwd=password,roles=[{'role':role,'db':'ganoh_production'}])
              reader=MongoClient(host,username=username,password=password,authSource='admin',serverSelectionTimeoutMS=5000)
              try:
                  if role=='read':
                      assert require_backup_reader(reader,username)['verified']
                  else:
                      try:require_backup_reader(reader,username)
                      except ArchiveError:pass
                      else:raise AssertionError('Write-capable fixture user was accepted')
              finally:reader.close()
          admin.close()
          print('PASS: actual local SCRAM role metadata, read accepted and readWrite refused')
          PY
      - name: Destroy local fixture databases
        if: always()
        run: docker rm -fv ganoh-fixtures
