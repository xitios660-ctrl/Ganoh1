name: Ganoh WhatsApp AI CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx pydantic
      - name: Compile changed backend modules
        run: python -m py_compile backend/server.py backend/routers/whatsapp_ai.py
      - name: Run WhatsApp AI tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_whatsapp_ai.py

  whatsapp-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: node --check server.mjs
      - name: Unit tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build Gestor
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          REACT_APP_BACKEND_URL: ''
        run: npm run build
