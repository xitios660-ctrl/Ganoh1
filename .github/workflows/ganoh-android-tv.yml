name: GANOH Android TV isolated demonstration
on:
  push:
    branches: [feature/windows-offline-ganoh-2026]
    paths: ['tv/**', '.github/workflows/ganoh-android-tv.yml']
  pull_request:
    paths: ['tv/**', '.github/workflows/ganoh-android-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify direct-download APK checksum
        working-directory: tv/downloads
        run: sha256sum -c SHA256SUMS
      - name: Unit tests lint and APK
        working-directory: tv/android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Sign demonstration APK with disposable test key
        shell: bash
        run: |
          export GANOH_TV_DEMO_STOREPASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/tv-demo.jks" -alias tv-demo -keyalg RSA -keysize 2048 -validity 3650 -storepass:env GANOH_TV_DEMO_STOREPASS -keypass:env GANOH_TV_DEMO_STOREPASS -dname 'CN=GANOH TV Demonstracao'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/tv-demo.jks" --ks-pass env:GANOH_TV_DEMO_STOREPASS --key-pass env:GANOH_TV_DEMO_STOREPASS --out "$RUNNER_TEMP/GANOH-TV-demo.apk" tv/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/GANOH-TV-demo.apk"
          sha256sum "$RUNNER_TEMP/GANOH-TV-demo.apk"
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV emulator installation and remote navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tv/tests/android_tv_smoke.py "$RUNNER_TEMP/GANOH-TV-demo.apk"
            adb uninstall com.ganoh.tv.demo
            python3 tv/tests/android_tv_smoke.py tv/downloads/GANOH-TV-demo.apk tv/tests/fixtures/ganoh-tv-0.1.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GANOH-Android-TV-DEMO-signed
          path: ${{ runner.temp }}/GANOH-TV-demo.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GANOH-TV-test-reports
          path: |
            tv/android/app/build/reports/tests/
            tv/android/app/build/reports/lint-results-release.html
            tv/android/app/build/test-results/
          retention-days: 14
