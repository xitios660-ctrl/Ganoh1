name: Build GANOH Windows demonstration (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-demo:
    if: github.ref == 'refs/heads/feature/windows-offline-ganoh-2026'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s desktop/tests -v
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          REACT_APP_DESKTOP_DEMO: 'true'
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
      - name: Package local backend and unchanged React assets
        run: python -m PyInstaller --noconfirm --onedir --name ganoh-local --paths . --collect-all sqlcipher3 --add-data "frontend/build;frontend/build" desktop/launcher.py
      - name: Test packaged backend persistence before installer
        run: python desktop/tests/windows_packaged_smoke.py --exe dist/ganoh-local/ganoh-local.exe
      - run: npm ci --no-audit --no-fund
        working-directory: desktop/electron
      - run: npm run dist
        working-directory: desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: GANOH-Windows-DEMO-UNSIGNED
          path: desktop/electron/dist/*.exe
          retention-days: 7
