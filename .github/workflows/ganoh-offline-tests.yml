name: GANOH offline journal regression tests

on:
  push:
    branches:
      - feature/windows-offline-ganoh-2026
    paths:
      - "desktop/**"
      - "backend/sync_v1/**"
      - ".github/workflows/ganoh-offline-tests.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "backend/sync_v1/**"
      - ".github/workflows/ganoh-offline-tests.yml"

permissions:
  contents: read

jobs:
  offline-core:
    name: SQLite journal on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install transport dependency
        run: python -m pip install httpx==0.28.1
      - name: Compile offline module
        run: python -m py_compile desktop/offline_store.py
      - name: Run durable journal regression tests
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v

  central-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r backend/sync_v1/requirements-test.txt
      - name: Start disposable replica set
        run: |
          docker run -d --name ganoh-sync-test -p 127.0.0.1:27028:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec ganoh-sync-test mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec ganoh-sync-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..30}; do
            if docker exec ganoh-sync-test mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 1
          done
      - run: python -m unittest discover -s backend/sync_v1/tests -v
      - if: always()
        run: docker rm -f ganoh-sync-test
