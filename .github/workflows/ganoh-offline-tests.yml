name: GANOH offline journal regression tests

on:
  push:
    branches:
      - feature/windows-offline-ganoh-2026
    paths:
      - "desktop/**"
      - ".github/workflows/ganoh-offline-tests.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/ganoh-offline-tests.yml"

permissions:
  contents: read

jobs:
  offline-core:
    name: SQLite journal on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile offline module
        run: python -m py_compile desktop/offline_store.py
      - name: Run durable journal regression tests
        run: python -m unittest discover -s desktop/tests -p "test_*.py" -v
