name: GANOH hourly continuity sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ganoh-hourly-continuity-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOURCE_BASE_URL: https://charts-3.emergent.host
      SOURCE_GESTOR_USERNAME: ${{ secrets.GANOH_SOURCE_GESTOR_USERNAME }}
      SOURCE_GESTOR_PASSWORD: ${{ secrets.GANOH_SOURCE_GESTOR_PASSWORD }}
      MONGO_URL: ${{ secrets.GANOH_MONGO_URL }}
      DB_NAME: ganohdb
      SYNC_APPLY: ${{ vars.GANOH_SYNC_APPLY || 'false' }}
      SYNC_DRY_RUN: ${{ vars.GANOH_SYNC_DRY_RUN || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 pymongo==4.5.0

      - name: Sync legacy operational data
        run: python scripts/sync_from_emergent.py
